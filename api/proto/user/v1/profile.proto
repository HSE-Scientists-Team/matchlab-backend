syntax = "proto3";
package matchlab.user.v1;
option go_package = "github.com/HSE-Scientists-Team/matchlab-backend/internal/gen/user/v1;userv1";

// Mutations authenticate the Bearer session in gRPC metadata. Internal moderation
// additionally requires an active moderator/administrator; never exposed by Gateway.
service ProfileService {
  rpc GetProfile(ProfileQuery) returns (Profile);
  rpc UpdateProfile(ProfileInput) returns (Profile);
  rpc GetSettings(Empty) returns (PrivacySettings);
  rpc UpdateSettings(PrivacySettings) returns (PrivacySettings);
  rpc ListAchievements(AchievementQuery) returns (AchievementList);
  rpc GetAchievement(AchievementID) returns (Achievement);
  rpc SaveAchievement(AchievementInput) returns (Achievement);
  rpc DeleteAchievement(AchievementID) returns (Empty);
  rpc SubmitAchievement(AchievementID) returns (Achievement);
  rpc ListBlocks(Page) returns (BlockList);
  rpc BlockUser(UserID) returns (Empty);
  rpc UnblockUser(UserID) returns (Empty);
  rpc CheckInteraction(InteractionQuery) returns (InteractionResult);
  rpc ListReviews(ReviewQuery) returns (ReviewList);
  rpc CreateReview(ReviewInput) returns (Review);
  // Internal-only RPCs, authorized independently of Gateway routing.
  rpc ListVerificationQueue(Page) returns (AchievementList);
  rpc ReviewAchievement(VerificationDecision) returns (Achievement);
  rpc GetAchievementEvidence(AchievementID) returns (Evidence);
  rpc RecordProjectContext(ProjectContext) returns (Empty);
}
message Empty {}
message Page { int32 limit = 1; int32 offset = 2; }
message UserID { string user_id = 1; }
message ProfileQuery { string user_id = 1; } // Empty means authenticated caller.
message ProfileInput {
  string display_name = 1;
  string avatar_file_id = 2;
  string university = 3;
  string study_level = 4;
  int32 study_year = 5;
  string specialization = 6;
  string about = 7;
  bool open_to_collaboration = 8;
  repeated string project_types = 9; // scientific/practical
  repeated string interests = 10;
  repeated string skills = 11;
  string contact_email = 12;
  string telegram = 13;
}
message Profile {
  string user_id = 1;
  ProfileInput details = 2;
  bool verified = 3; // confirmed exact hse.ru or edu.hse.ru email
  double rating = 4;
  int32 review_count = 5;
  int32 positive_review_count = 6; // rating >= 4
}
message PrivacySettings { bool show_contacts = 1; bool show_participating_projects = 2; }
message AchievementQuery { string user_id = 1; string kind = 2; Page page = 3; }
message AchievementID { string id = 1; }
message AchievementInput {
  string id = 1; // Empty creates a new item.
  string kind = 2; // education/certificate/scientific/project
  string title = 3;
  string description = 4;
  string institution = 5;
  int32 graduation_year = 6;
  string url = 7;
  string evidence_file_id = 8;
  int32 expected_revision = 9; // Required for update; optimistic concurrency.
}
message Achievement {
  string id = 1;
  string user_id = 2;
  AchievementInput details = 3;
  string status = 4; // unverified/pending_review/verified/needs_evidence
  int32 revision = 5;
  string moderation_comment = 6; // Owner/moderator only.
  int64 created_at_unix = 7;
}
message AchievementList { repeated Achievement items = 1; }
message Block { string user_id = 1; string display_name = 2; int64 created_at_unix = 3; }
message BlockList { repeated Block items = 1; }
message InteractionQuery { string from_user_id = 1; string to_user_id = 2; }
message InteractionResult { bool blocked = 1; }
message VerificationDecision { string id = 1; int32 expected_revision = 2; bool approve = 3; string comment = 4; }
message Evidence { string download_url = 1; int64 expires_at_unix = 2; }
// Minimal project/team snapshot. Future Projects owns project lifecycle;
// no public CRUD for projects is provided here. Completed snapshots are immutable.
message ProjectContext {
  string project_id = 1;
  string title = 2;
  string initiator_user_id = 3;
  repeated string participant_user_ids = 4;
  int64 completed_at_unix = 5; // 0 means current team; positive means completed.
}
message ReviewQuery { string user_id = 1; Page page = 2; }
message ReviewInput { string project_id = 1; string target_user_id = 2; string title = 3; string text = 4; int32 rating = 5; }
message Review {
  string id = 1;
  string author_user_id = 2;
  string author_display_name = 3;
  string author_role = 4;
  string project_id = 5;
  string project_title = 6;
  string target_user_id = 7;
  string title = 8;
  string text = 9;
  int32 rating = 10;
  int64 created_at_unix = 11;
  int64 project_completed_at_unix = 12;
}
message ReviewList { repeated Review items = 1; }
