syntax = "proto3";

package matchlab.user.v1;

option go_package = "github.com/HSE-Scientists-Team/matchlab-backend/internal/gen/user/v1;userv1";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc ConfirmEmail(ConfirmEmailRequest) returns (ConfirmEmailResponse);
  rpc GetEmailStatus(GetEmailStatusRequest) returns (GetEmailStatusResponse);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string session_token = 2;
}

message RequestEmailVerificationRequest {
  string user_id = 1;
  string email = 2;
}

message RequestEmailVerificationResponse {}

message ConfirmEmailRequest {
  string token = 1;
}

message ConfirmEmailResponse {}

message GetEmailStatusRequest {
  string user_id = 1;
}

message GetEmailStatusResponse {
  string email = 1;
  string status = 2;
  string pending_email = 3;
}
