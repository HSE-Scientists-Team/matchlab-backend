openapi: 3.1.0
info:
  title: MatchLab Gateway API
  version: 2.6.0
  description: |
    Текущий публичный HTTP API MatchLab: учётные записи, сеансы, подтверждение почты, файлы, жалобы и личные текстовые чаты.
    Это описание реализованных маршрутов Gateway. Для локальной проверки сначала
    зарегистрируйтесь, подтвердите email из письма, затем войдите и укажите полученный токен доступа в Bearer Auth.
    Для регистрации администратор должен настроить разрешённые почтовые домены.
    В локальном Compose письмо появляется в Mailpit по адресу http://localhost:8025;
    в рабочем окружении используется настроенный SMTP.
    Токен из ссылки в письме передайте в метод подтверждения адреса.
servers:
  - url: /
    description: API в текущем окружении (через тот же origin)
  - url: http://localhost:8080
    description: Gateway в локальном Docker Compose
tags:
  - name: Администрирование
    description: Отдельная авторизация сотрудников, модерация и аудит; роли moderator и administrator.
  - name: Состояние
  - name: Учётная запись
  - name: Почта
  - name: Сеанс
  - name: Файлы
    description: Цельная загрузка, метаданные, скачивание и удаление; затем загрузка частями, прогресс, завершение и отмена.
  - name: Support
    description: Создание жалоб
  - name: Chat
    description: Личные текстовые диалоги
