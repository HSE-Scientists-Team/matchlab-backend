  /api/v1/recommendations/people:
    get:
      tags:
      - Поиск и рекомендации
      summary: Рекомендации соавторов из периодического расчёта с резервной выдачей
      description: |
        Ранжированные ID читаются из Redis, карточки и блокировки проверяются User заново.
        При отсутствии профиля в кэше, истечении срока или сбое Redis используется доступный каталог.
        recommendation содержит версию модели, время расчёта и факторы для возвращённых ID.
        score — сигнал сортировки, не вероятность успеха. total — размер каталога владельца
        до дополнительной проверки кандидатов, а не число записей в кэше.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleList'
        '400':
          description: Некорректные поля
        '401':
          description: Требуется действительный сеанс
        '403':
          description: Недостаточно прав или блокировка
        '404':
          description: Объект не найден
        '409':
          description: Конфликт версии, состояния или занятое место
        '500':
          description: Внутренняя ошибка
        '503':
          description: Зависимость недоступна
        '504':
          description: Истёк срок запроса
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
  /api/v1/recommendations/projects:
    get:
      tags:
      - Проекты
      summary: Рекомендации проектов из периодического расчёта с резервной выдачей
      description: |
        Проекты из кэша проверяются через текущий Project API: видимость, состояние,
        участие и свободные места. Блокировки проверяются User. При сбое кэша есть резервная выдача.
        recommendation объясняет расчёт на generated_at; score не является процентом совместимости.
      security:
