      description: |
        Результат административной операции.

        - `started` — Операция начата, итог ещё не зафиксирован.
        - `succeeded` — Операция успешно завершена.
        - `failed` — Зафиксирована ошибка выполнения.
        - `unknown` — Ответ зависимости потерян или истёк тайм-аут; результат нужно уточнить по состоянию и истории перед повтором.
      enum:
        - started
        - succeeded
        - failed
        - unknown
      type: string
      x-enum-descriptions:
        - Операция начата, итог ещё не зафиксирован.
        - Операция успешно завершена.
        - Зафиксирована ошибка выполнения.
        - Ответ зависимости потерян или истёк тайм-аут; результат нужно уточнить по состоянию и истории перед повтором.
