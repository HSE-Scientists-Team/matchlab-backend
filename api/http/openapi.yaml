      description: |
        Требует сеанс и подтверждённую почту. Владелец определяется из сеанса.
        Возвращает pending и подписанный PUT. Передайте байты файла напрямую по upload_url,
        с выданными headers, затем вызовите complete. Не используйте multipart/form-data.
        В браузере Content-Length формируется автоматически. is_public по умолчанию false.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUpload'
            example:
              original_name: avatar.png
              content_type: image/png
              size_bytes: 1024
              is_public: true
      responses:
        '201':
          description: Создана запись pending. Файл ещё не загружен.
          headers:
            Location:
              schema: {type: string}
              description: HTTP-путь к метаданным файла.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MediaForbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /api/v1/media/files/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    post:
      tags: [Файлы]
      summary: Подтвердить загрузку файла
      operationId: completeMediaUpload
      description: |
        Только владелец с подтверждённой почтой, включая публичные файлы.
        Тело запроса не требуется. Media проверяет объект в S3 и переводит pending в ready.
        Проверяются тип, лимит и ожидаемый размер (для новых загрузок).
        Pending без обновления БД 24 часа также обрабатывает фоновая задача:
        подтверждает корректный объект или очищает S3 и сохраняет failed.
        Повтор возвращает сохранённые метаданные ready.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Файл подтверждён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFileResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MediaForbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'

  /api/v1/media/files/{id}:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    delete:
      tags: [Файлы]
      summary: Удалить файл из S3
      operationId: deleteMediaFile
      description: |
        Только владелец с действующим сеансом и подтверждённой почтой, включая публичные файлы.
        user_id берётся из сеанса. Чужой или отсутствующий файл возвращает 404.
        Для ready удаляет объект из S3 и сохраняет deleted в БД; повтор владельцем возвращает 204.
        Если удаление не завершилось, намерение сохраняется в БД, файл скрывается из чтения и
        обрабатывается фоновой задачей при старте Media и каждые 10 минут.
        pending и failed возвращают 409; для отмены multipart используйте DELETE /{id}/multipart.
        Удаление объекта не отзывает ранее выданные подписанные PUT-ссылки.
      security: [ { bearerAuth: [ ] } ]
      responses:
        '204': { description: Объект удалён или файл уже был удалён этим владельцем. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/MediaTimeout' }
    get:
      tags: [Файлы]
      summary: Получить метаданные файла
      operationId: getMediaFile
      description: |
        Публичный файл доступен без сеанса; приватный — только владельцу.
        Если Authorization передан, он проверяется вместе с подтверждением почты.
        Недействительный токен возвращает 401, а не гостевой доступ.
        Не передавайте user_id в запросе. Ответы не кешируются (Cache-Control no-store).
      security:
        - { }
        - bearerAuth: [ ]
      responses:
        '200':
          description: Метаданные без ссылки на содержимое; доступны и в состоянии pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFileResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MediaForbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /api/v1/media/files/{id}/download-url:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    get:
      tags: [Файлы]
      summary: Получить временную ссылку на скачивание
      operationId: createMediaDownloadURL
      description: |
        Для ready. Публичный файл доступен гостю, приватный — владельцу.
        Переданный Authorization проверяется вместе с подтверждением почты.
        Ответ Cache-Control no-store. Выполните GET по download_url напрямую в S3,
        без Bearer-токена Gateway. Ссылка даёт доступ любому её получателю до истечения TTL.
      security:
        - { }
        - bearerAuth: [ ]
      responses:
        '200':
          description: Подписанная GET-ссылка на содержимое.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownload'
              example:
                download_url: 'http://localhost:8333/matchlab-media/users/example/file?X-Amz-Signature=example'
                expires_at_unix: 1791543600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/MediaForbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/MediaTimeout'
  /api/v1/media/files/multipart:
    post:
      tags: [Файлы]
      summary: Начать загрузку файла частями
      operationId: createMediaMultipart
      description: |
        Требует сеанс и подтверждённую почту. Возвращает pending-файл и параметры сессии.
        Размер части задаёт Media; последняя часть может быть меньше. Байты передаются
        напрямую в S3 через part-urls. Существующая загрузка одним PUT также доступна.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMediaUpload'}
            example: {original_name: report.pdf, content_type: application/pdf, size_bytes: 8388611, is_public: false}
      responses:
        '201':
          description: Созданы pending-файл и сессия загрузки.
          headers:
            Location:
              schema: {type: string}
              description: Путь к состоянию multipart-сессии.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaMultipartState'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/MediaForbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/MediaTimeout'}
  /api/v1/media/files/{id}/multipart:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    get:
      tags: [Файлы]
      summary: Получить прогресс загрузки частями
      operationId: getMediaMultipart
      description: |
        Только владелец с подтверждённой почтой, даже для публичного файла.
        Прогресс учитывает полностью принятые S3 части. В SeaweedFS после повторного PUT
        возможны несколько ETag одного номера; uploaded_bytes учитывает этот номер один раз.
        Сохраняйте ETag ответов PUT для завершения. Ответ Cache-Control no-store.
      security: [ { bearerAuth: [ ] } ]
      responses:
        '200':
          description: Состояние сессии и принятые части; для completed uploaded_bytes равен размеру файла.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaMultipartState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/MediaTimeout' }
    delete:
      tags: [Файлы]
      summary: Отменить загрузку частями
      operationId: abortMediaMultipart
      description: |
        Только владелец с подтверждённой почтой. Прерывает S3-сессию и переводит файл
        в failed. Повтор отмены возвращает 204. Для completing и completed возвращает 409.
        Перед отменой остановите отправку частей на клиенте.
      security: [ { bearerAuth: [ ] } ]
      responses:
        '204': { description: Загрузка отменена. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/MediaForbidden' }
        '404': { $ref: '#/components/responses/MediaNotFound' }
        '409': { $ref: '#/components/responses/MediaConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/MediaTimeout' }
  /api/v1/media/files/{id}/multipart/part-urls:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    post:
      tags: [Файлы]
      summary: Получить ссылки для отправки частей
      operationId: createMediaPartURLs
      description: |
        Только владелец с подтверждённой почтой. Допускает 1–100 уникальных номеров
        от 1 до part_count. Передайте каждую часть напрямую в S3 методом PUT с выданными
        headers и ровно size_bytes байтов. Не используйте multipart/form-data.
        Сохраните ETag ответа PUT. Для повтора части или истечения ссылки запросите новую.
        Ссылка действует не дольше срока сессии. Completing, completed, aborted и просроченная сессия дают 409.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [part_numbers]
              properties:
                part_numbers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: integer, format: int32, minimum: 1, maximum: 10000}
            example: {part_numbers: [1, 2]}
      responses:
        '200':
          description: Подписанные PUT-ссылки для частей.
          content:
            application/json:
              schema:
                type: object
                required: [parts]
                properties:
                  parts:
                    type: array
                    items: {$ref: '#/components/schemas/MediaPartURL'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/MediaForbidden'}
        '404': {$ref: '#/components/responses/MediaNotFound'}
        '409': {$ref: '#/components/responses/MediaConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/MediaTimeout'}
  /api/v1/media/files/{id}/multipart/complete:
    parameters:
      - $ref: '#/components/parameters/MediaFileID'
    post:
      tags: [Файлы]
      summary: Собрать и подтвердить загруженные части
      operationId: completeMediaMultipart
      description: |
        Только владелец с подтверждённой почтой. Передайте полный список номеров и ETag
        из ответов PUT, включая кавычки ETag. Порядок списка произвольный, номера уникальны.
        Media проверяет части и размер, собирает объект в S3 и переводит файл в ready.
        Лимит JSON — 1 МиБ. Повтор с тем же списком безопасен после потери ответа.
        Прерванное completing восстанавливается Media. При конфликте ETag загрузка
        возвращается в uploading: получите состояние, повторите части и завершение.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [parts]
              properties:
                parts:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [part_number, etag]
                    properties:
                      part_number: {type: integer, format: int32, minimum: 1, maximum: 10000}
                      etag: {type: string, minLength: 1}
            example:
              parts:
                - {part_number: 1, etag: '"ETAG_FROM_FIRST_PUT"'}
                - {part_number: 2, etag: '"ETAG_FROM_SECOND_PUT"'}
      responses:
        '200':
          description: Файл готов; повтор возвращает сохранённые метаданные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaFileResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/MediaForbidden'}
        '404': {$ref: '#/components/responses/MediaNotFound'}
        '409': {$ref: '#/components/responses/MediaConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/MediaTimeout'}
  /health:
    get:
      tags: [Состояние]
      summary: Проверить, что Gateway отвечает
      description: Проверяет сам HTTP-процесс; состояние его зависимостей не проверяется.
      operationId: getHealth
      responses:
        '200':
          description: Gateway принимает запросы.
          content:
            text/plain:
              schema:
                type: string
              example: "ok\n"
  /api/v1/auth/register:
    post:
      tags: [Учётная запись]
      summary: Зарегистрировать пользователя
      description: Email обязателен и приводится к нижнему регистру. Сохраняется заявка и отправляется письмо; аккаунта и сеанса ещё нет. Повтор с тем же email заменяет пароль и токен заявки. Существующий аккаунт менять нельзя.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: student@hse.ru
              password: example-password-123
      responses:
        '201':
          description: Письмо принято SMTP. Для продолжения подтвердите email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
              example:
                status: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email уже зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email уже зарегистрирован
        '403':
          $ref: '#/components/responses/OrganizationUnavailable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      tags: [Учётная запись]
      summary: Войти по email и паролю
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: student@hse.ru
              password: example-password-123
      responses:
        '200':
          description: Сеанс создан. Используйте access_token для защищённых методов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                user_id: 4f9a4c95-6144-4ec8-89e8-3866207d7561
                access_token: пример-токена-доступа
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль, в том числе до подтверждения регистрации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: неверный email или пароль
        '403':
          description: Почта не подтверждена или учётная запись неактивна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: подтвердите адрес электронной почты
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/users/me/email:
    get:
      tags: [Почта]
      summary: Получить состояние адреса
      operationId: getEmailStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий и ожидающий адреса пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailStatus'
              example:
                status: verified
                email: student@hse.ru
        '403':
          description: Почта не подтверждена (включая старые сеансы).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/email/confirm:
    post:
      tags: [Почта]
      summary: Подтвердить адрес из письма
      description: |
        Передайте token из актуальной ссылки в письме. Этот метод не требует Bearer-токена.
        Аккаунт создаётся с паролем подтверждённой заявки, а заявка удаляется.
        Старые ссылки после повторной регистрации и использованные токены недействительны.
      operationId: confirmEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailRequest'
            example:
              token: ТОКЕН_ИЗ_ПИСЬМА
      responses:
        '204':
          description: Адрес подтверждён, аккаунт создан.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/OrganizationUnavailable'
        '404':
          description: Токен не найден или уже использован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: токен подтверждения не найден или уже использован
        '409':
          description: Email уже зарегистрирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email уже зарегистрирован
        '410':
          description: Срок действия токена истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: срок подтверждения адреса электронной почты истёк
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/sessions/current:
    get:
      tags: [Сеанс]
      summary: Получить пользователя текущего сеанса
      operationId: getCurrentSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Сеанс действителен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserId'
              example:
                user_id: 4f9a4c95-6144-4ec8-89e8-3866207d7561
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Почта не подтверждена.
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Сеанс]
      summary: Завершить текущий сеанс
      operationId: revokeCurrentSession
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Сеанс отозван.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/complaints:
    post:
      tags: [Support]
      summary: Создать жалобу
      operationId: createComplaint
      description: |
        Требует сеанс и подтверждённую почту. Автор определяется из сеанса.
        Нужно указать ровно один target_user_id или target_project_id.
        Цели проверяются по формату UUID, существование пока не проверяется.
        Файлы предварительно загружаются и подтверждаются через Media;
        вложения должны принадлежать автору и иметь статус ready.
        Повтор запроса создаёт новую жалобу.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaint'
            example:
              subject: Жалоба на пользователя
              description: Описание нарушения
              target_user_id: '00000000-0000-4000-8000-000000000002'
              file_ids: []
      responses:
        '201':
          description: Жалоба создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedComplaint'
        '400':
          description: Некорректный запрос, отсутствующая или двойная цель, дубли файлов
        '401':
          description: Отсутствующий или недействительный сеанс
        '403':
          description: Почта не подтверждена
        '404':
          description: Вложение не найдено или не принадлежит автору
        '409':
          description: Вложение ещё не готово
        '500':
          description: Не удалось сохранить жалобу
        '502':
          description: Некорректный ответ Support
        '503':
          description: Зависимость недоступна или срок запроса истёк
  /api/v1/chat/conversations:
    post:
      tags: [Chat]
      operationId: chatOpenConversation
      summary: Открыть личный диалог
      description: |
        Возвращает существующий диалог пары или создаёт новый. Чат с собой запрещён.
        Требуется активный аккаунт с подтверждённой почтой, проверяется блокировка в обе стороны.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatOpenInput'}
            example: {user_id: '00000000-0000-4000-8000-000000000002'}
      responses:
        '200':
          description: Существующий диалог
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatConversation'}
        '201':
          description: Новый диалог
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatConversation'}
        '400': {description: Некорректный UUID или диалог с собой}
        '401': {description: Требуется действительный сеанс}
        '403': {description: Аккаунт неактивен или взаимодействие заблокировано}
        '404': {description: Собеседник не найден}
        '503': {description: User недоступен}
    get:
      tags: [Chat]
      operationId: chatListConversations
      summary: Список своих диалогов
      description: |
        Сортировка по последней активности и ID убыванию, включая пустые диалоги.
        Непрочитанные — только входящие сообщения. Курсор передаётся из next_cursor.
        Это живая выдача, новые сообщения могут менять порядок между страницами.
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200':
          description: Диалоги пользователя
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ChatConversation'}}
                  next_cursor: {type: string, description: Пустая строка означает конец списка}
        '400': {description: Некорректная пагинация}
        '401': {description: Требуется действительный сеанс}
        '403': {description: Требуется активный подтверждённый аккаунт}
        '503': {description: User недоступен}
  /api/v1/chat/conversations/{id}/messages:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Chat]
      operationId: chatListMessages
      summary: История сообщений
      description: |
        Без фильтра — последняя страница. before_seq выбирает более старые,
        after_seq — ближайшие новые сообщения. Границы исключительные, фильтры несовместимы.
        Порядок ответа всегда seq ASC. Чтение истории не меняет отметку прочтения.
        Для polling продолжайте с after_seq последнего полученного сообщения.
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: before_seq, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: after_seq, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Страница в хронологическом порядке
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
                  has_more: {type: boolean}
        '400': {description: Некорректные фильтры или пагинация}
        '401': {description: Требуется действительный сеанс}
        '403': {description: Требуется активный подтверждённый аккаунт}
        '404': {description: Диалог отсутствует или пользователь не участник}
        '503': {description: User недоступен}
    post:
      tags: [Chat]
      operationId: chatSendMessage
      summary: Отправить текстовое сообщение
      description: |
        Автор определяется из сеанса. Текст сохраняется без обработки разметки;
        фронт отображает его как обычный текст. Проверяется блокировка в обе стороны.
        Повтор с тем же client_message_id и текстом возвращает прежнее сообщение,
        даже после последующей блокировки. Другой текст с тем же ID — 409.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatSendInput'}
            example: {client_message_id: '00000000-0000-4000-8000-000000000003', body: 'Привет!'}
      responses:
        '201':
          description: Сообщение создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '200':
          description: Повтор ранее выполненной отправки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '400': {description: Некорректные ID или текст}
        '401': {description: Требуется действительный сеанс}
        '403': {description: Аккаунт неактивен или взаимодействие заблокировано}
        '404': {description: Диалог отсутствует или пользователь не участник; собеседник неактивен}
        '409': {description: client_message_id уже использован с другим текстом}
        '503': {description: User недоступен}
        '504': {description: Истёк срок выполнения запроса}
  /api/v1/chat/conversations/{id}/read:
    put:
      tags: [Chat]
      operationId: chatMarkRead
      summary: Отметить сообщения прочитанными
      description: |
        Отметка включает указанный seq, может только увеличиваться и не превышает
        последний номер сообщения. Старые и повторные отметки безопасны.
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [last_read_seq]
              properties:
                last_read_seq: {type: integer, format: int64, minimum: 0}
            example: {last_read_seq: 12}
      responses:
        '204': {description: Отметка сохранена}
        '400': {description: Некорректный номер или номер за пределами истории}
        '401': {description: Требуется действительный сеанс}
        '403': {description: Требуется активный подтверждённый аккаунт}
        '404': {description: Диалог отсутствует или пользователь не участник}
        '503': {description: User недоступен}
components:
  parameters:
    MediaFileID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  securitySchemes:
    AdminSession:
      type: http
      scheme: bearer
      description: Только отдельный сеанс из POST /api/v1/admin/auth/login; обычный пользовательский токен не подходит.
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен access_token из ответа POST /api/v1/auth/login.
  schemas:
    ChatOpenInput:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string, format: uuid, description: UUID собеседника в каноническом формате}
    ChatSendInput:
      type: object
      additionalProperties: false
      required: [client_message_id, body]
      properties:
        client_message_id: {type: string, format: uuid, description: Новый UUID для сообщения; сохраняется при повторных попытках}
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: Обычный UTF-8 текст; не только пробелы и без NUL; пробелы по краям сохраняются
    ChatMessage:
      type: object
      required: [id, conversation_id, seq, sender_user_id, client_message_id, body, created_at_unix]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        seq: {$ref: '#/components/schemas/ChatInt64'}
        sender_user_id: {type: string, format: uuid}
        client_message_id: {type: string, format: uuid}
        body: {type: string, description: Отображать как текст без интерпретации HTML}
        created_at_unix: {$ref: '#/components/schemas/ChatInt64'}
    ChatConversation:
      type: object
      required: [id, peer_user_id, last_message_seq, last_read_seq, peer_last_read_seq, unread_count, created_at_unix]
      properties:
        id: {type: string, format: uuid}
        peer_user_id: {type: string, format: uuid}
        last_message_seq: {$ref: '#/components/schemas/ChatInt64'}
        last_read_seq: {$ref: '#/components/schemas/ChatInt64'}
        peer_last_read_seq: {$ref: '#/components/schemas/ChatInt64'}
        unread_count: {$ref: '#/components/schemas/ChatInt64'}
        created_at_unix: {$ref: '#/components/schemas/ChatInt64'}
        last_message_at_unix: {$ref: '#/components/schemas/ChatInt64', description: Отсутствует у пустого диалога}
        last_message:
          oneOf:
            - {$ref: '#/components/schemas/ChatMessage'}
            - {type: 'null'}
    ChatInt64:
      type: string
      pattern: '^[0-9]+$'
      description: int64 передаётся десятичной строкой согласно ProtoJSON; время — Unix seconds
