      description: |
        Команда изменения состояния проекта. Недопустимый переход возвращает 409.

        - `publish` — unpublished → recruiting: опубликовать проект.
        - `unpublish` — recruiting → unpublished: снять с публикации.
        - `start` — recruiting → active: начать выполнение.
        - `complete` — active → completed: завершить проект.
