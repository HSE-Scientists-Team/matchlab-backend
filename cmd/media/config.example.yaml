grpc:
  host: 127.0.0.1
  port: 8085
postgres:
  host: localhost
  port: 5432
  database: matchlab
  user: matchlab
  ssl_mode: disable
s3:
  endpoint: http://localhost:8333
  public_endpoint: http://localhost:8333
  region: us-east-1
  bucket: matchlab-media
  use_path_style: true
  request_timeout: 5s
upload:
  url_ttl: 10m
  max_size_bytes: 10485760
  allowed_content_types:
    - application/pdf
    - image/jpeg
    - image/png
download:
  url_ttl: 5m
