name: Собрать и опубликовать образы

on:
  workflow_dispatch:
    inputs:
      service:
        description: Какой образ собрать
        required: true
        default: all
        type: choice
        options: [all, gateway, auth, user, mail]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      repository: ${{ steps.matrix.outputs.repository }}
    steps:
      - id: matrix
        env:
          SERVICE: ${{ inputs.service }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$SERVICE" in
            all) services='["gateway","auth","user","mail"]' ;;
            gateway|auth|user|mail) services="[\"$SERVICE\"]" ;;
            *) exit 1 ;;
          esac
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -tags=integration ./internal/auth/repository/redis ./pkg/migrations ./internal/user/repository ./internal/mail/smtp
  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: cmd/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Показать опубликованный образ
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
