name: Тесты и покрытие

on:
  pull_request:

permissions:
  contents: read

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependency-free recommendation core
        run: PYTHONPATH=ml python -m unittest discover -s ml/tests -v
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить административный OpenAPI
        run: go run ./scripts/api/admin-openapi.go --check
      - name: Проверить все пакеты и покрытие сервисов
        run: bash scripts/ci/test-coverage.sh
      - name: Запустить интеграционные тесты с контейнерами Redis, PostgreSQL, Mailpit и SeaweedFS
        run: go test -tags=integration ./internal/auth/repository/redis ./pkg/migrations ./internal/user/repository ./internal/mail/smtp ./internal/media/repository ./internal/media/storage/s3 ./cmd/media ./internal/support/repository ./internal/user/profile ./internal/project ./internal/admin ./internal/user/management ./internal/support/management ./internal/chat
      - name: Загрузить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: internal-coverage
          path: coverage/coverage.out

  container-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [api-docs, airflow, mlflow]
    steps:
      - uses: actions/checkout@v4
      - name: Select Dockerfile
        id: dockerfile
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            api-docs) path=api/http/Dockerfile ;;
            airflow) path=ml/Dockerfile.airflow ;;
            mlflow) path=ml/Dockerfile.mlflow ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          load: true
          push: false
          tags: matchlab-runtime-test:local
          cache-from: type=gha,scope=runtime-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.service }}
      - name: Verify non-root runtime and writable state
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 scripts/ci/test-container-runtime.py "$SERVICE" matchlab-runtime-test:local
