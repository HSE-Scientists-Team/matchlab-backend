name: Тесты и покрытие

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Проверить все пакеты и покрытие сервисов
        run: bash scripts/ci/test-coverage.sh
      - name: Запустить интеграционные тесты с контейнерами Redis и PostgreSQL
        run: go test -tags=integration ./internal/auth/repository/redis ./internal/user/migrations ./internal/mail/migrations ./internal/mail/smtp
      - name: Загрузить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: internal-coverage
          path: coverage/coverage.out
